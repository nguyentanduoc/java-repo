networks:
  app-network:
    driver: bridge
services:
  postgres:
    image: postgres:18.6-trixie
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql
    networks:
      - app-network

  redis:
    image: redis:8.8.1-trixie
    container_name: redis-cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass 123456a --appendonly yes
    networks:
      - app-network

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:123456a
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - app-network
